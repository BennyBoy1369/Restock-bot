name: Pokemon restock check

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub may run it a bit later)
  workflow_dispatch:            # lets you run it by hand from the Actions tab
    inputs:
      test_alert:
        description: "Just send a test alert to my phone"
        type: boolean
        default: false

concurrency:
  group: restock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Remembers what was already in stock so you don't get repeat alerts
      - name: Load memory from last run
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: restock-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: restock-state-

      - name: Check stores
        env:
          TEXTING_METHOD: ntfy
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          WALMART_ENABLED: "false"   # Walmart blocks GitHub's computers
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python restock_bot.py --test-text
          else
            python restock_bot.py --once
          fi

      - name: Save memory for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: restock-state-${{ github.run_id }}-${{ github.run_attempt }}
